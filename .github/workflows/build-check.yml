name: build-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require quality release notes
        run: bash build/check-release-notes.sh
      - name: Compile the app and pack the zip
        run: docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src debian:trixie-slim bash build/release-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: banana-party-${{ github.run_number }}
          path: |
            dist/banana-party-*.zip
            dist/Install-Banana-Party.sh
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Verify assembled release notes
        run: bash build/assemble-release-notes.sh | head -n 5